theme = "default"

[placeholders]
"default" = {input = "Buscando...", list = "Sin resultados"}
"desktopapplications" = {input = "Launch App", list = "No se encontró ninguna aplicación"}

[providers]
default = [
  "desktopapplications",
  "calc",
  "runner",
  "menus",
  "websearch",
]

empty = ["desktopapplications"]

max_results = 50


[[providers.prefixes]]
prefix = "w"
provider = "menus:wallpapers"



