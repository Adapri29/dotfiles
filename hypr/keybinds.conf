# Tecla modificadora principal
$mod = SUPER

# =====================================================================
# ACCIONES GENERALES
# =====================================================================

bind = $mod, Return, exec, kitty          # Abrir terminal
bind = $mod, Q, killactive                # Cerrar ventana activa
bind = $mod, F, fullscreen                # Pantalla completa
bind = $mod, Space, exec, walker 	  # Lanzador de aplicaciones
bind = $mod SHIFT, E, exit                # Cerrar sesión Hyprland

# =====================================================================
# FOCO (HJKL — estilo vim)
# =====================================================================

bind = $mod, H, movefocus, l  # Foco a la izquierda
bind = $mod, L, movefocus, r  # Foco a la derecha
bind = $mod, K, movefocus, u  # Foco arriba
bind = $mod, J, movefocus, d  # Foco abajo

# =====================================================================
# MOVER VENTANAS
# =====================================================================

bind = $mod SHIFT, H, movewindow, l  # Mover ventana a la izquierda
bind = $mod SHIFT, L, movewindow, r  # Mover ventana a la derecha
bind = $mod SHIFT, K, movewindow, u  # Mover ventana arriba
bind = $mod SHIFT, J, movewindow, d  # Mover ventana abajo

bind = $mod, F, togglefloating, # Ventana flotante
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
# =====================================================================
# WORKSPACES
# =====================================================================

# Cambiar al workspace N
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6

# Mover ventana activa al workspace N
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6

# Mover ventana al workspace anterior/siguiente (relativo)
bind = $mod SHIFT, left,  movetoworkspace, -1
bind = $mod SHIFT, right, movetoworkspace, +1

# =====================================================================
# AUDIO (teclas multimedia — sin modificador)
# =====================================================================

# wpctl opera sobre PipeWire. @DEFAULT_AUDIO_SINK@ = salida activa.
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+  # Subir volumen
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-  # Bajar volumen
bind = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle  # Silenciar salida
bind = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Silenciar micrófono

# =====================================================================
# CAPTURA DE PANTALLA
# =====================================================================

bind = , Print, exec, grim - | wl-copy			  # Captura de pantalla completa
bind = $mod SHIFT, S, exec, slurp | grim -g - - | wl-copy  # Captura de un área seleccionada (la más útil)
